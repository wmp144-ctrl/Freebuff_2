name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  CI: '1'

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (frontend types vs API contracts)
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  unit:
    name: Unit · Frontend unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Server unit tests (engine, db, auth, retention, sse)
        run: npm run test:unit
      - name: Frontend unit tests (live buffer, async gate, url params)
        run: npm run test:web

  database:
    name: Database · Migration · Backup/Restore · Retention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Database, migration and retention suites
        run: npm run test:db
      - name: Engine suites
        run: npm run test:engine

  integration:
    name: Integration · Security · RBAC · Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Build frontend (SPA fallback and /app-health are tested too)
        run: npm run build
      - name: Integration tests (API, engine, db stability, retention, security, RBAC, contract)
        run: npm run test:integration
      - name: E2E smoke and flow tests
        run: npm run test:e2e

  browser:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Build frontend used by the test server
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: UI regression tests
        run: npm run test:ui
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
